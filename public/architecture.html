<!doctype html>
<html lang="en" dir="ltr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/svg+xml" href="/elm-logo.svg"><title>Architecture — Technology Service Hub</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/architecture.css"></head>
<body class="arch-body">
<header class="arch-header"><div class="editor-brand"><a id="back" href="/" aria-label="Back to service">←</a><img src="/elm-logo.svg" width="34" height="30" alt="Elm"><div><h1 id="title">Architecture</h1><span id="state" role="status">Loading…</span></div></div><div class="arch-actions"><button id="generate" class="btn">Generate from records</button><button id="export" class="btn">Export SVG</button><button id="save" class="btn primary">Save diagram</button></div></header>
<div id="inventory-notice" role="status" hidden></div>
<nav class="arch-tools" aria-label="Diagram tools">
<div class="tool-group"><button id="tool-select" class="btn selected" title="Select and move items (V)" aria-pressed="true">↖ Select</button><button id="tool-pan" class="btn" title="Pan canvas (H or hold Space)" aria-pressed="false">✋ Hand</button><button id="connect" class="btn" aria-pressed="false">Connect items</button></div>
<div class="tool-group"><button id="undo" class="btn" title="Undo (Ctrl+Z)" disabled>↶ Undo</button><button id="redo" class="btn" title="Redo (Ctrl+Shift+Z)" disabled>↷ Redo</button></div>
<div class="tool-group"><button id="collapse-groups" class="btn">Collapse groups</button><button id="connections-list" class="btn">Connections</button><button id="layout" class="btn">Auto layout</button></div>
<div class="tool-group zoom-tools"><button id="zoom-out" class="btn" aria-label="Zoom out">−</button><span id="zoom-label">100%</span><button id="zoom-in" class="btn" aria-label="Zoom in">＋</button><button id="fit" class="btn">Fit</button></div>
</nav>
<div class="arch-workspace">
<aside id="shape-library" aria-label="Shape library"><h2>Shapes</h2><input id="shape-search" type="search" placeholder="Search shapes…" aria-label="Search shapes"><p>Drag a shape onto the canvas</p><div id="shape-list"></div><details class="all-shapes"><summary>More components</summary><label for="type">Component type</label><select id="type"></select><button id="add" class="btn">＋ Add component</button></details></aside>
<main id="viewport" aria-label="Diagram canvas"><svg id="canvas" tabindex="0" aria-describedby="hint" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Interactive service architecture"></svg></main>
<aside id="inspector" aria-label="Properties panel"><h2>Properties</h2><p>Select a shape or connection.</p></aside>
</div>
<footer class="editor-status"><span id="hint">Drag items to move · Drag a blue handle to connect · Space to pan</span><span id="diagram-count"></span></footer>
<script src="/vendor/elk.bundled.js"></script><script type="module" src="/architecture-editor.js"></script>
</body></html>
